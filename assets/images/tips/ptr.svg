<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="ptrFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3d75"/>
      <stop offset="1" stop-color="#1C2B54"/>
    </linearGradient>
    <linearGradient id="ptrTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4f8a"/>
      <stop offset="1" stop-color="#1C2B54"/>
    </linearGradient>
    <linearGradient id="ptrSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1C2B54"/>
      <stop offset="1" stop-color="#0f1c45"/>
    </linearGradient>
  </defs>
  <!-- PTR cuadrado izquierda -->
  <g transform="translate(15,55)">
    <polygon points="0,15 50,0 65,8 65,75 50,90 0,90" fill="url(#ptrFront)"/>
    <polygon points="0,15 50,0 65,8 15,23 15,90 0,90" fill="url(#ptrSide)"/>
    <polygon points="50,0 65,8 65,75 50,82" fill="url(#ptrTop)"/>
    <polygon points="0,15 50,0 65,8 15,23" fill="#fff" opacity=".15"/>
    <!-- hueco interior -->
    <polygon points="22,30 47,22 60,28 60,72 47,80 22,80" fill="#000" opacity=".55"/>
    <text x="32" y="115" font-family="Inter,Arial,sans-serif" font-weight="800" font-size="14" fill="#1C2B54" text-anchor="middle">CUADRADO</text>
  </g>
  <!-- PTR rectangular derecha -->
  <g transform="translate(95,55)">
    <polygon points="0,15 70,0 85,8 85,55 70,70 0,70" fill="url(#ptrFront)"/>
    <polygon points="0,15 70,0 85,8 15,23 15,70 0,70" fill="url(#ptrSide)"/>
    <polygon points="70,0 85,8 85,55 70,62" fill="url(#ptrTop)"/>
    <polygon points="0,15 70,0 85,8 15,23" fill="#fff" opacity=".15"/>
    <polygon points="22,30 67,22 80,28 80,52 67,60 22,60" fill="#000" opacity=".55"/>
    <text x="42" y="115" font-family="Inter,Arial,sans-serif" font-weight="800" font-size="14" fill="#DD3B2E" text-anchor="middle">RECTANGULAR</text>
  </g>
</svg>
