<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#94a3b8"/>
      <stop offset=".5" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="chuck" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="1" stop-color="#1e293b"/>
    </radialGradient>
    <radialGradient id="hot" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFE082"/>
      <stop offset=".5" stop-color="#F08018"/>
      <stop offset="1" stop-color="#DD3B2E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Eje torno (barra giratoria) -->
  <rect x="20" y="85" width="130" height="22" rx="3" fill="url(#bar)"/>
  <!-- Chuck (mordaza) -->
  <circle cx="35" cy="96" r="18" fill="url(#chuck)"/>
  <circle cx="35" cy="96" r="4" fill="#0f172a"/>
  <line x1="35" y1="78" x2="35" y2="114" stroke="#0f172a" stroke-width="2"/>
  <line x1="17" y1="96" x2="53" y2="96" stroke="#0f172a" stroke-width="2"/>
  <!-- Buril cobalto -->
  <g>
    <rect x="100" y="50" width="14" height="40" rx="2" fill="#1C2B54"/>
    <rect x="100" y="50" width="14" height="6" fill="#F08018"/>
    <polygon points="100,90 114,90 110,98 104,98" fill="#94a3b8"/>
  </g>
  <!-- Calor / chispa -->
  <circle cx="107" cy="100" r="14" fill="url(#hot)"/>
  <!-- Etiqueta cobalto -->
  <text x="155" y="58" font-family="Inter,Arial,sans-serif" font-weight="800" font-size="11" fill="#F08018">COBALTO</text>
  <!-- Líneas de viruta -->
  <g stroke="#cbd5e1" stroke-width="1.5" fill="none" opacity=".7">
    <path d="M 95 110 q -8 8 -3 16"/>
    <path d="M 105 115 q -10 10 -2 18"/>
    <path d="M 115 110 q -3 12 4 18"/>
  </g>
  <text x="100" y="160" font-family="Inter,Arial,sans-serif" font-weight="800" font-size="14" fill="#1C2B54" text-anchor="middle">TORNO + INOX</text>
</svg>
