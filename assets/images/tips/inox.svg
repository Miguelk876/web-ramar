<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="potB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset=".5" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="potR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <!-- Olla 304 (izq) — buena para cocina -->
  <g transform="translate(15,80)">
    <ellipse cx="40" cy="6" rx="40" ry="6" fill="url(#potR)"/>
    <path d="M 0 6 L 8 65 a 32 6 0 0 0 64 0 L 80 6 Z" fill="url(#potB)"/>
    <!-- Asas -->
    <ellipse cx="-2" cy="20" rx="6" ry="10" fill="#1C2B54"/>
    <ellipse cx="82" cy="20" rx="6" ry="10" fill="#1C2B54"/>
    <text x="40" y="40" font-family="Inter,Arial,sans-serif" font-weight="900" font-size="22" fill="#1C2B54" text-anchor="middle">304</text>
    <text x="40" y="85" font-family="Inter,Arial,sans-serif" font-weight="700" font-size="10" fill="#16a34a" text-anchor="middle">COCINA</text>
  </g>
  <!-- Decor 430 (der) — solo decorativo -->
  <g transform="translate(115,80)">
    <rect x="0" y="0" width="70" height="62" rx="4" fill="url(#potB)"/>
    <rect x="0" y="0" width="70" height="8" fill="#94a3b8"/>
    <text x="35" y="38" font-family="Inter,Arial,sans-serif" font-weight="900" font-size="22" fill="#1C2B54" text-anchor="middle">430</text>
    <text x="35" y="85" font-family="Inter,Arial,sans-serif" font-weight="700" font-size="10" fill="#dc2626" text-anchor="middle">SOLO DECOR</text>
  </g>
  <!-- Vapor sobre olla 304 -->
  <g stroke="#94a3b8" stroke-width="2" fill="none" opacity=".7" stroke-linecap="round">
    <path d="M 35 65 q 3 -10 -2 -16"/>
    <path d="M 50 60 q -3 -10 2 -18"/>
    <path d="M 65 65 q 3 -10 -2 -16"/>
  </g>
</svg>
