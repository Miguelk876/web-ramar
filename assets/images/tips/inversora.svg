<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="boxOj" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F08018"/>
      <stop offset="1" stop-color="#cf6610"/>
    </linearGradient>
    <linearGradient id="boxBl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C2B54"/>
      <stop offset="1" stop-color="#0f1c45"/>
    </linearGradient>
  </defs>
  <!-- Inversora (chiquita, ligera) -->
  <g transform="translate(20,90)">
    <rect x="0" y="0" width="65" height="50" rx="6" fill="url(#boxOj)"/>
    <rect x="0" y="0" width="65" height="10" fill="#fff" opacity=".25"/>
    <!-- Display -->
    <rect x="8" y="14" width="22" height="10" rx="1" fill="#000"/>
    <text x="19" y="22" font-family="monospace" font-size="8" fill="#22d3ee" text-anchor="middle">120A</text>
    <!-- Perilla -->
    <circle cx="48" cy="20" r="6" fill="#1C2B54"/>
    <circle cx="48" cy="20" r="2" fill="#F08018"/>
    <!-- Asa -->
    <path d="M 15 -5 q 17 -10 35 0" stroke="#1C2B54" stroke-width="3" fill="none"/>
    <text x="32" y="42" font-family="Inter,Arial,sans-serif" font-weight="800" font-size="9" fill="#fff" text-anchor="middle">INVERSORA</text>
  </g>
  <text x="52" y="160" font-family="Inter,Arial,sans-serif" font-weight="700" font-size="11" fill="#16a34a" text-anchor="middle">LIGERA · OBRA</text>

  <!-- Transformadora (grande, pesada) -->
  <g transform="translate(105,55)">
    <rect x="0" y="0" width="80" height="90" rx="4" fill="url(#boxBl)"/>
    <rect x="0" y="0" width="80" height="14" fill="#fff" opacity=".15"/>
    <!-- Rejilla -->
    <g stroke="#0f1c45" stroke-width="1.5" opacity=".7">
      <line x1="10" y1="22" x2="70" y2="22"/>
      <line x1="10" y1="28" x2="70" y2="28"/>
      <line x1="10" y1="34" x2="70" y2="34"/>
    </g>
    <!-- Perilla grande -->
    <circle cx="40" cy="58" r="14" fill="#0f1c45" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="40" cy="58" r="4" fill="#F08018"/>
    <line x1="40" y1="58" x2="40" y2="48" stroke="#F08018" stroke-width="2"/>
    <text x="40" y="84" font-family="Inter,Arial,sans-serif" font-weight="800" font-size="9" fill="#fff" text-anchor="middle">TRANSFORM.</text>
  </g>
  <text x="145" y="160" font-family="Inter,Arial,sans-serif" font-weight="700" font-size="11" fill="#dc2626" text-anchor="middle">PESADA · TALLER</text>
</svg>
